
name: CI/CD - Backend Caminhões (Deploy no Render)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-producao
  cancel-in-progress: false

jobs:
  ci:
    name: 1. CI - Checagem de tipos e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npm run type-check

      - name: Compilar projeto
        run: npm run build

  docker-build:
    name: 2. CD - Build da imagem Docker
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: |
          docker build \
            --tag caminhoes-api:${{ github.sha }} \
            -f backend/Dockerfile \
            backend

  deploy:
    name: 3. CD - Deploy no Render
    needs: [ci, docker-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Acionar Deploy Hook do Render
        env:
         RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::error::Segredo RENDER_DEPLOY_HOOK_URL não configurado."
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error --max-time 30 \
            --output resposta.json \
            --write-out '%{http_code}' \
            -X POST "${RENDER_DEPLOY_HOOK_URL}")

          echo "Status HTTP: ${HTTP_STATUS}"
          cat resposta.json || true

          if [ "${HTTP_STATUS}" != "200" ] && \
             [ "${HTTP_STATUS}" != "201" ]; then
            echo "::error::Falha ao acionar o deploy."
            exit 1
          fi

      - name: Resumo da entrega
        run: |
          echo "Deploy acionado com sucesso no Render."
          echo "Commit: ${{ github.sha }}"
